<!-- <p>borrow-equipment-card works!</p> -->
<div class="card-container">
  <div class="image-wrapper">
    <img
      class="fit-image"
      [src]="equipment?.images?.midSizeUrl || defaultImage"
      alt=""
    />
  </div>
  <div class="text-wrapper">
    <div class="item-name">{{ equipment.name }}</div>
    <div class="brand">
      <span>{{ equipment.brand }}</span>
      <span>Qty: {{ equipment.availability.available }}</span>
    </div>
    <div
      class="availability"
      [class.unavailable]="available == 'unavailable'"
      (click)="viewBorrowHistory()"
    >
      <span>{{ available }}</span>
      <mat-icon>info</mat-icon>
    </div>
  </div>
  <div class="action-wrapper">
    <div class="detail-button">
      <button color="accent" mat-raised-button (click)="viewItemDetails()">
        Detail
      </button>
    </div>
    <button
      mat-raised-button
      color="primary"
      (click)="addEquipment()"
      [disabled]="available == 'unavailable'"
    >
      Add
    </button>
  </div>
</div>
