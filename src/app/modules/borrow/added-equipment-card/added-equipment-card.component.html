<mat-card class="added-equipment">
  <img
    class="fit-image"
    [src]="
      equipment.images.thumbnailUrl
        ? equipment.images.thumbnailUrl
        : '../../../../assets/equipment_default_image_thumbnail.png'
    "
    alt=""
  />

  <div class="item-name">{{ equipment.name }}</div>
  <form [formGroup]="addedItemForm">
    <mat-form-field class="qty-input">
      <mat-label>Qty</mat-label>
      <input
        matInput
        formControlName="quantity"
        [readonly]="length == 1"
      />
    </mat-form-field>
  </form>

    <button

    >
      <mat-icon>remove</mat-icon>
    </button>
    <button
      mat-icon-button
      (click)="increaseQuantity()"
      [disabled]="length == 1"
    >
      <mat-icon>add</mat-icon>
    </button>
  </div> -->
  <div class="circle">
    <button mat-icon-button (click)="removeItem()">
      <mat-icon>close</mat-icon>
    </button>
  </div>
</mat-card>
