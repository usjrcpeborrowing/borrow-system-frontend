<div class="dialog-container">
  <h2 mat-dialog-title>Equipment Details</h2>
  <form [formGroup]="equipmentForm">
    <mat-dialog-content class="dialog-content">
      <div class="img-wrapper">
        <img [src]="data.images.midSizeUrl || defaultImage" alt="" />
      </div>

      <div class="detail-wrapper">
        <mat-form-field>
          <mat-label>Name</mat-label>
          <input matInput formControlName="name" [readonly]="canEdit" />
        </mat-form-field>
        <mat-form-field appearance="outline">
          <mat-label>Serial No.</mat-label>
          <input matInput formControlName="serialNo" [readonly]="canEdit" />
        </mat-form-field>
        <mat-form-field appearance="outline">
          <mat-label>Equipment Type</mat-label>
          <input
            matInput
            formControlName="equipmentType"
            [readonly]="canEdit"
          />
        </mat-form-field>
        <mat-form-field appearance="outline">
          <mat-label>Brand</mat-label>
          <input matInput formControlName="brand" [readonly]="canEdit" />
        </mat-form-field>
        <mat-form-field appearance="outline">
          <mat-label>Color</mat-label>
          <input matInput formControlName="color" [readonly]="canEdit" />
        </mat-form-field>
        <mat-form-field appearance="outline">
          <mat-label>Model No</mat-label>
          <input matInput formControlName="modelNo" [readonly]="canEdit" />
        </mat-form-field>
        <mat-form-field appearance="outline">
          <mat-label>Quantity</mat-label>
          <input matInput formControlName="quantity" [readonly]="canEdit" />
        </mat-form-field>
        <mat-form-field appearance="outline">
          <mat-label>Unit</mat-label>
          <input matInput formControlName="unit" [readonly]="canEdit" />
        </mat-form-field>
        <mat-form-field appearance="outline">
          <mat-label>Matter</mat-label>
          <input matInput formControlName="matter" [readonly]="canEdit" />
        </mat-form-field>
        <mat-form-field appearance="outline">
          <mat-label>Department</mat-label>
          <input matInput formControlName="department" [readonly]="canEdit" />
        </mat-form-field>
        <mat-form-field appearance="outline">
          <mat-label>Inventory Type</mat-label>
          <input
            matInput
            formControlName="inventorytype"
            [readonly]="canEdit"
          />
        </mat-form-field>
        <mat-form-field appearance="outline">
          <mat-label>Location</mat-label>
          <input matInput formControlName="location" [readonly]="canEdit" />
        </mat-form-field>
        <mat-checkbox formControlName="isborrow">Can be borrowed</mat-checkbox>
      </div>
    </mat-dialog-content>

    <mat-dialog-actions align="end">
      <button mat-button mat-dialog-close>Cancel</button>
      <button mat-button (click)="canEdit = !canEdit">
        Edit Before Saving
      </button>
      <button
        mat-button
        [mat-dialog-close]="equipmentForm.value"
        cdkFocusInitial
      >
        Confirm
      </button>
    </mat-dialog-actions>
  </form>
</div>
