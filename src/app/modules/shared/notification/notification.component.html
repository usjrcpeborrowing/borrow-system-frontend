<div class="notification-wrapper">
  <div class="action-wrapper">
    <mat-chip (click)="markAllAsReads()">Mark all as reads</mat-chip>
  </div>
  <div *ngIf="!notifications.length" class="no-notification">
    Empty Notification
  </div>
  <a
    *ngFor="let notification of notifications"
    [routerLink]="notification.route"
  >
    <div
      class="notification"
      [class.viewed]="notification.viewed"
      (click)="markAsRead(notification._id)"
    >
      <div class="notification-type">
        <span>{{ notification.type }}</span>
        <span>{{ notification.createdAt | date: 'mediumDate' }}</span>
      </div>
      <div class="notification-message">{{ notification.message }}</div>
    </div>
  </a>
</div>
<section id="pagination" (click)="$event.stopPropagation()">
  <mat-paginator
    [length]="pagination.length"
    [pageSize]="pagination.limit"
    [pageIndex]="pagination.page - 1"
    [pageSizeOptions]="pagination.pageSizeOption"
    [showFirstLastButtons]="true"
    [hidePageSize]="true"
    (page)="paginate($event)"
  >
  </mat-paginator>
</section>
