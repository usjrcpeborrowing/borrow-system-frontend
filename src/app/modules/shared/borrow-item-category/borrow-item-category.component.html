<div class="panel-name underlined">Filters</div>
<div class="form-fields-container">
  <mat-form-field floatLabel="always">
    <mat-label>Search</mat-label>
    <input matInput placeholder="Type Here" autocomplete="off" />
    <mat-icon matSuffix>search</mat-icon>
  </mat-form-field>
  <mat-form-field class="form-field">
    <mat-label>Borrow Status</mat-label>
    <mat-select (selectionChange)="navigate($event)">
      <mat-option *ngFor="let status of borrowstatus" [value]="status">
        {{ status }}
      </mat-option>
    </mat-select>
  </mat-form-field>

  <div class="action-wrapper">
    <button mat-raised-button color="accent" (click)="resetFilters()">
      Reset Filter
    </button>
  </div>
</div>
