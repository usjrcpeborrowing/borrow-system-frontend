<div class="header">
  <app-header></app-header>
</div>
<div class="page">
  <div class="dashboard-content">
    <app-dashboard-buttons></app-dashboard-buttons>
  </div>
  <div class="page-content">
    <div class="page-title">
      <div
        class="view-category-container clickable"
        [class.cart-openside]="openedCategory"
        (click)="categoryClicked()"
      >
        <mat-icon>menu</mat-icon>
      </div>
      <div class="title-page">Borrowed Items</div>
    </div>
    <mat-drawer-container class="example-container">
      <mat-drawer mode="side" [opened]="openedCategory" position="start">
        <div class="search-filter-wrapper">
          <mat-form-field floatLabel="always">
            <mat-label>Search</mat-label>
            <input matInput placeholder="Type Here" autocomplete="off" />
            <mat-icon matSuffix>search</mat-icon>
          </mat-form-field>
        </div>
        <app-borrow-item-category></app-borrow-item-category>
      </mat-drawer>
      <mat-drawer-content class="custom-drawer-itmes">
        <app-borrow-card [items]="borrowedItems"></app-borrow-card>
      </mat-drawer-content>
    </mat-drawer-container>
  </div>
</div>
