<div class="header">
  <app-header></app-header>
</div>
<div class="page">
  <div class="dashboard-content">
    <app-dashboard-buttons></app-dashboard-buttons>
  </div>
  <div class="page-content">
    <div class="page-title">
      <div
        class="view-category-container clickable"
        [class.cart-openside]="openedCategory"
        (click)="categoryClicked()"
      >
        <mat-icon>menu</mat-icon>
      </div>
  
      <div class="title-page">Borrowed Items</div>
    </div>
    <mat-drawer-container>
      <mat-drawer
        mode="side"
        [opened]="openedCategory"
        position="start"
        class="example-container"
      >
        <app-borrow-item-category></app-borrow-item-category>
      </mat-drawer>
      <mat-drawer-content class="custom-drawer-itmes">
        <app-student-borrow-card
          [items]="borrowedItems"
        ></app-student-borrow-card>
      </mat-drawer-content>
    </mat-drawer-container>
  </div>
</div>
