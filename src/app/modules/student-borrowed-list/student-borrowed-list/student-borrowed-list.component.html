<div class="header">
  <app-header></app-header>
</div>
<div class="page">
  <div class="dashboard-content">
    <app-dashboard-buttons></app-dashboard-buttons>
  </div>
  <div class="page-content">
    <div class="page-title">
      <div
        class="view-category-container clickable"
        [class.cart-openside]="openedCategory"
        (click)="categoryClicked()"
      >
        <mat-icon>tune</mat-icon>
      </div>

      <div class="title-page underlined">Borrowed Items</div>
    </div>
    <mat-drawer-container [hasBackdrop]="false">
      <mat-drawer mode="push" [opened]="openedCategory" position="start">
        <app-borrow-item-category></app-borrow-item-category>
      </mat-drawer>
      <mat-drawer-content>
        <mat-spinner *ngIf="isloading; else elseblock"></mat-spinner>
        <ng-template #elseblock>
          <app-student-borrow-card
            [items]="borrowedItems"
          ></app-student-borrow-card>
        </ng-template>
      </mat-drawer-content>
    </mat-drawer-container>
  </div>
</div>
