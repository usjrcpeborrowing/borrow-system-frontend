<html>
<div class="header">
    <app-header></app-header>
</div>
<h1 class="page-title">
    <div class="toggle-button">
    <button class="toggle-button" (click)="toggleSidebar()" mat-icon-button >
        <mat-icon>{{ isSidebarExpanded ? 'chevron_left' : 'menu' }}</mat-icon>
    </button>
    </div>
    Dashboard
    <div class="hline">

    </div>
</h1>
<div class="dashboard-content">
    
    <div class="sidebar" [class.expanded]="isSidebarExpanded">

        <div class="buttons">
            <button (click)="directToBorrow()" mat-raised-button>
                <mat-icon>inbox</mat-icon>
                <span class="button-text" *ngIf="isSidebarExpanded">Borrow Items</span>
            </button>

            <button (click)="directToInventory()" mat-raised-button>
                <mat-icon>inbox</mat-icon>
                <span class="button-text" *ngIf="isSidebarExpanded">Inventory</span>
            </button>

            <button (click)="directToInventoryRequest()" mat-raised-button>
                <mat-icon>inbox</mat-icon>
                <span class="button-text" *ngIf="isSidebarExpanded">Inventory Requests</span>
            </button>

            <button (click)="showStudentRequests()" mat-raised-button>
                <mat-icon>assignment</mat-icon>
                <span class="button-text" *ngIf="isSidebarExpanded">Student Requests</span>
            </button>

            <button (click)="directToHistory()" mat-raised-button>
                <mat-icon>history</mat-icon>
                <span class="button-text" *ngIf="isSidebarExpanded">History</span>
            </button>
        </div>
    </div>
    <div class="menu-panel-mobile">
        <div class="buttons">
            <button style=" justify-content: flex-start;" mat-raised-button  (click)="directToBorrow()">
                <div class="button-text">
                    <mat-icon class="icon-text">inbox</mat-icon>
                    Borrow Items
                    </div>
                </button>
            <button style=" justify-content: flex-start;" mat-raised-button (click)="directToInventory()">
                <div class="button-text">
                    <mat-icon class="icon-text">inbox</mat-icon>
                    Inventory List
                    </div>
                </button>
            <button style=" justify-content: flex-start;" mat-raised-button  (click)="showStudentRequests()">
                <div class="button-text">
                    <mat-icon class="icon-text">assignment</mat-icon>
                    Student Requests
                    </div>
                </button>
            <button style=" justify-content: flex-start;" mat-raised-button  (click)="directToItemDetails()">
                <div class="button-text">
                    <mat-icon class="icon-text">inbox</mat-icon>
                    Item Details
                    </div>
                </button>
            <button style=" justify-content: flex-start;" mat-raised-button  (click)="showReports()">
                <div class="button-text">
                    <mat-icon class="icon-text">report</mat-icon>
                    Reports
                    </div>
                </button>
            <button style=" justify-content: flex-start;" mat-raised-button (click)="directToHistory()">
                <div class="button-text">
                    <mat-icon class="icon-text">history</mat-icon>
                    Requests History
                    </div>
                </button>
            
        </div>
    </div>
    <div class="contents">
        <app-content-tabs *ngIf="showContentTabs"></app-content-tabs>
        <app-system-reports *ngIf="showReportsComponent"></app-system-reports>
    </div>

</div>
</html>
