<div class="header">
    <app-header></app-header>
</div>
<div class="page">
    <div class="dashboard-buttons">
        <app-dashboard-buttons></app-dashboard-buttons>
    </div>
    <div class="page-content">
        <h1 class="page-title">
            Dashboard
            <div class="hline">
            </div>
        </h1>
        <div class="menu-panel-mobile">
            <div class="buttons">
                <button (click)="directToBorrow()" class="buttons-buttons" mat-raised-button>
                    <div class="button-text">
                        <mat-icon class="icon-text">inbox</mat-icon>
                        Borrow Items
                    </div>
                </button>
                <button (click)="directToInventory()" class="buttons-buttons" mat-raised-button>
                    <div class="button-text">
                        <mat-icon class="icon-text">inbox</mat-icon>
                        Items
                    </div>
                </button>
                
                <button (click)="directToItemDetails()" class="buttons-buttons" mat-raised-button>
                    <div class="button-text">
                        <mat-icon class="icon-text">inbox</mat-icon>
                        Item Details
                    </div>
                </button>
                <button (click)="directToInventoryRequest()" class="buttons-buttons" mat-raised-button>
                    <div class="button-text">
                        <mat-icon class="icon-text">assignment</mat-icon>
                        Inventory Requests
                    </div>
                </button>
                <button (click)="directToBorrowRequest()" class="buttons-buttons" mat-raised-button>
                    <div class="button-text">
                        <mat-icon class="icon-text">assignment</mat-icon>
                        Student Requests
                    </div>
                </button>
                <button (click)="directToHistory()" class="buttons-buttons" mat-raised-button>
                    <div class="button-text">
                        <mat-icon class="icon-text">history</mat-icon>
                        History
                    </div>
                </button>
            </div>
        </div>

        <div class="contents">
            <app-content-tabs></app-content-tabs>
        </div>
    </div>
</div>
