<div class="contents">
    <h1 class="page-title">New Items</h1>
    <div class="featured-items">
      <div *ngFor="let item of itemlist" class="item-panel">
        <img
            class="fit-image"
            [src]="item?.images?.midSizeUrl"
            alt=""
        />
        <div class="item-name">{{ item.name }}</div>
        </div>
    </div>
</div>
