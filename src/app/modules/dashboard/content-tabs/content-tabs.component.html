<div class="contents">
    <h1 class="page-title">New Items</h1>
    <div class="featured-items">
      <div *ngFor="let item of itemlist" class="item-panel">
                
        <div class="image-wrapper">
            <img
            class="fit-image"
            [src]="item?.images?.midSizeUrl ? displayImage : defaultImage"
            alt=""
            />
        </div>
        <div class="item-name">{{ item.name }}</div>
        </div>
        
    </div>
    
</div>
