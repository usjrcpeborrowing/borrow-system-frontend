<div class="scrollable-panel">
  <div class="table-header">
    <div>Name</div>
    <div>Serial No</div>
    <div>Equipment Type</div>
    <div>Brand</div>
    <div>Inventory Type</div>
    <div>Condition</div>
    <div>Quantity</div>
    <div>Availability</div>
  </div>
  <div class="table-content">
    <table
      mat-table
      [dataSource]="equipmentlist"
      class="mat-elevation-z8"
      *ngIf="equipmentlist.length > 0; else noResults"
    >
      <ng-container matColumnDef="itemPanel">
        <td mat-cell *matCellDef="let item">
          <app-item-panel [item]="item"></app-item-panel>
        </td>
      </ng-container>
      <tr
        mat-row
        *matRowDef="let item; let i = index; columns: ['itemPanel']"
      ></tr>
    </table>
    <ng-template #noResults>
      <app-no-results></app-no-results>
    </ng-template>
  </div>
</div>
<div class="generate-buttons">
  <div class="add-button">
    <button mat-raised-button (click)="addItem()">Add Item</button>
  </div>
  <span class="spacer"></span>
  <div class="report-button" *ngIf="isFaculty()">
    <button mat-raised-button (click)="reportItems()" disabled>
      Report Inventory
    </button>
  </div>
  <div class="report-button">
    <button
      mat-raised-button
      (click)="download()"
      [class.spinner]="isloading"
      [disabled]="isloading"
    >
      Download Report
    </button>
  </div>
</div>
