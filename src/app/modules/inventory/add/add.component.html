<div class="panel-title">
  <h1>Add Item</h1>
</div>

<div class="add-item">
  <form [formGroup]="addItemForm" (ngSubmit)="onSubmit()">
    <div class="second-content">
      <h1 class="header-form">Item Description</h1>
      <div class="form-container">
        <mat-form-field class="addName" floatLabel="always">
          <mat-label>Item Name</mat-label>
          <input matInput formControlName="name" autocomplete="off" />
        </mat-form-field>
        <!-- <mat-form-field class="addEquipment" floatLabel="always">
                    <mat-label>Equipment Type</mat-label>
                    <input
                        matInput
                        formControlName="equipmentType"
                        autocomplete="off"
                    />
                </mat-form-field>
                <mat-form-field class="addBrand" floatLabel="always">
                    <mat-label>Brand Name</mat-label>
                    <input
                        matInput
                        formControlName="brand"
                        autocomplete="off"
                    />
                </mat-form-field> -->
        <!-- <mat-form-field class="addEquipment" floatLabel="always">
                    <mat-label>Equipment Type</mat-label>
                    <input type="text"
                        formControlName="equipmentType" matInput [formControl]="equipmentTypeControl" [matAutocomplete]="autoEquipmentType">
                    <mat-autocomplete #autoEquipmentType="matAutocomplete">
                       <mat-option *ngFor="let filter of filteredEquipmentTypes | async" [value]="filter">
                            {{filter}}
                        </mat-option>
                    </mat-autocomplete>
                </mat-form-field> -->
        <mat-form-field class="addEquipment" floatLabel="always">
          <mat-label>Equipment Type</mat-label>
          <input
            type="text"
            matInput
            formControlName="equipmentType"
            [matAutocomplete]="autoEquipmentType"
          />
          <mat-autocomplete #autoEquipmentType="matAutocomplete">
            <mat-option
              *ngFor="let option of filteredEquipmentTypes | async"
              [value]="option"
            >
              {{ option }}
            </mat-option>
          </mat-autocomplete>
        </mat-form-field>

        <mat-form-field class="addBrand" floatLabel="always">
          <mat-label>Brand Name</mat-label>
          <input
            type="text"
            matInput
            formControlName="brand"
            [matAutocomplete]="autoBrand"
          />
          <mat-autocomplete #autoBrand="matAutocomplete">
            <mat-option
              *ngFor="let filter of filteredBrands | async"
              [value]="filter"
            >
              {{ filter }}
            </mat-option>
          </mat-autocomplete>
        </mat-form-field>

        <mat-form-field class="serialNo" floatLabel="always">
          <mat-label>Serial No.</mat-label>
          <input matInput formControlName="serialNo" autocomplete="off" />
        </mat-form-field>
        <mat-form-field class="serialNo" floatLabel="always">
          <mat-label>Model No.</mat-label>
          <input matInput formControlName="modelNo" autocomplete="off" />
        </mat-form-field>
        <mat-form-field class="serialNo" floatLabel="always">
          <mat-label>Quantity</mat-label>
          <input matInput formControlName="quantity" autocomplete="off" />
        </mat-form-field>
        <mat-form-field class="serialNo" floatLabel="always">
          <mat-label>Unit</mat-label>
          <input matInput formControlName="unit" autocomplete="off" />
        </mat-form-field>
        <mat-form-field class="addMatter" floatLabel="always">
          <mat-label>Matter Type</mat-label>
          <mat-select formControlName="matter">
            <mat-option *ngFor="let matter of matters" [value]="matter">
              {{ matter }}
            </mat-option>
          </mat-select>
        </mat-form-field>
        <mat-form-field class="addDescription" floatLabel="always">
          <mat-label>Inventory Type</mat-label>
          <mat-select formControlName="inventorytype">
            <mat-option
              *ngFor="let inventorytype of inventorytypes"
              [value]="inventorytype"
            >
              {{ inventorytype }}
            </mat-option>
          </mat-select>
        </mat-form-field>
        <mat-form-field class="addColor" floatLabel="always">
          <mat-label>Color</mat-label>
          <input matInput formControlName="color" autocomplete="off" />
        </mat-form-field>
      </div>
    </div>

    <div class="third-content">
      <h1 class="header-form">Item Status</h1>
      <div class="form-container">
        <mat-form-field class="addRemarks" floatLabel="always">
          <mat-label>Condition</mat-label>
          <mat-select formControlName="condition">
            <mat-option *ngFor="let remark of remarks" [value]="remark">
              {{ remark }}
            </mat-option>
          </mat-select>
        </mat-form-field>
        <mat-form-field class="checkedBy" floatLabel="always">
          <mat-label>Checked By</mat-label>
          <input
            matInput
            autocomplete="off"
            [placeholder]="checkedBy"
            readonly
          />
        </mat-form-field>
        <mat-form-field class="addLocation" floatLabel="always">
          <mat-label>Location</mat-label>
          <input
            matInput
            formControlName="location"
            autocomplete="off"
            [matAutocomplete]="autoLocation"
          />
          <mat-autocomplete #autoLocation="matAutocomplete">
            <mat-option
              *ngFor="let location of filteredLocation | async"
              [value]="location"
            >
              {{ location }}
            </mat-option>
          </mat-autocomplete>
        </mat-form-field>

        <mat-form-field class="addDepartment" floatLabel="always">
          <mat-label>Department</mat-label>
          <input
            matInput
            formControlName="department"
            autocomplete="off"
            [(ngModel)]="userDepartment"
            readonly
          />
        </mat-form-field>
        <mat-checkbox formControlName="isborrow">Can be borrowed</mat-checkbox>
      </div>
    </div>
    <div class="first-content">
      <div class="image-container">
        <img [src]="imageUrl || 'http://placehold.it/180'" />
      </div>
      <!-- <div class="add-image">
                <input type="text" placeholder="Enter Google Drive Image Link" (blur)="loadImageFromGoogleDrive($event)">
            </div> -->
      <div class="add-image">
        <input type="file" accept="image/*" (change)="loadImageFromFile($event)"/>
      </div>
    </div>
    <div class="add-button">
      <button mat-raised-button type="submit" [disabled]="isloading">
        <mat-spinner
          *ngIf="isloading; else addItem"
          diameter="20"
        ></mat-spinner>
        <ng-template #addItem>
          <span>Add Item</span>
        </ng-template>
      </button>
    </div>
  </form>
</div>
